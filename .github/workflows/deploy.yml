name: Automated Production Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/school-portal-app

jobs:
  # ── Step 1: Build image on GitHub's fast runners and push to GHCR ──────────
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache layers between builds using GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 2: SSH into VPS, pull the pre-built image, restart containers ──────
  deploy-to-vps:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into VPS & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /var/www/school-portal

            echo "=== PULLING LATEST CODE ==="
            git pull origin main

            echo "=== LOGGING INTO GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            echo "=== PULLING PRE-BUILT IMAGE FROM GHCR ==="
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            echo "=== TAGGING IMAGE FOR COMPOSE ==="
            docker tag ghcr.io/${{ env.IMAGE_NAME }}:latest school-portal-school-portal-app:latest

            echo "=== RESTARTING CONTAINERS ==="
            docker compose -f compose.yml up -d --force-recreate school-portal-app school-portal-worker

            echo "=== CLEANING UP OLD IMAGES ==="
            docker image prune -f || true

            echo "=== DEPLOYMENT COMPLETE ==="
            docker compose -f compose.yml ps
