name: Automated Production Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/school-portal-app

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (with full log output)
        run: |
          docker buildx build \
            --progress=plain \
            --build-arg CACHEBUST=${{ github.run_number }} \
            --load \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            . 2>&1 | tee /tmp/docker-build.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "===== BUILD FAILED (exit $exit_code) ====="
            tail -200 /tmp/docker-build.log
            exit $exit_code
          fi

      - name: Push image
        if: success()
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: /tmp/docker-build.log
          retention-days: 3

  deploy-to-vps:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into VPS & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /var/www/school-portal

            echo "=== PULLING LATEST CODE ==="
            git pull origin main

            echo "=== LOGGING INTO GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            echo "=== PULLING PRE-BUILT IMAGE FROM GHCR ==="
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            echo "=== TAGGING IMAGE FOR COMPOSE ==="
            docker tag ghcr.io/${{ env.IMAGE_NAME }}:latest school-portal-school-portal-app:latest

            echo "=== RESTARTING CONTAINERS ==="
            docker compose -f compose.yml up -d --force-recreate school-portal-app school-portal-worker

            echo "=== CLEANING UP OLD IMAGES ==="
            docker image prune -f || true

            echo "=== DEPLOYMENT COMPLETE ==="
            docker compose -f compose.yml ps
