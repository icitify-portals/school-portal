name: CI/CD Debug & Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/school-portal-app

jobs:
  debug-build:
    name: Debug - Test next build on runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run next build and capture output
        run: |
          echo "### Starting next build at $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          NODE_OPTIONS="--max-old-space-size=4096" npx next build 2>&1 | tee /tmp/next-build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
          echo "Build ended at $(date -u)" >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: /tmp/next-build.log
          retention-days: 3

  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: debug-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            CACHEBUST=${{ github.run_number }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-vps:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into VPS & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /var/www/school-portal

            echo "=== PULLING LATEST CODE ==="
            git pull origin main

            echo "=== LOGGING INTO GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            echo "=== PULLING PRE-BUILT IMAGE FROM GHCR ==="
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            echo "=== TAGGING IMAGE FOR COMPOSE ==="
            docker tag ghcr.io/${{ env.IMAGE_NAME }}:latest school-portal-school-portal-app:latest

            echo "=== RESTARTING CONTAINERS ==="
            docker compose -f compose.yml up -d --force-recreate school-portal-app school-portal-worker

            echo "=== CLEANING UP OLD IMAGES ==="
            docker image prune -f || true

            echo "=== DEPLOYMENT COMPLETE ==="
            docker compose -f compose.yml ps
