name: Automated Production Deployment (Direct SSH Pipeline)

on:
  push:
    branches:
      - main

# Never let two deployments race each other; the newest push always wins.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy-to-vps:
    name: Deploy Live Application to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Hostinger VPS & Update Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # Next.js Docker builds regularly exceed the 10-minute default
          command_timeout: 60m
          # Stop on the first failing command (belt-and-braces alongside set -e)
          script_stop: true
          script: |
            set -e
            cd /var/www/school-portal

            echo "=== PULLING LATEST CODE FROM MAIN ==="
            git pull origin main

            echo "=== BUILDING NEW APP IMAGE ==="
            docker compose build school-portal-app

            echo "=== RESTARTING APP CONTAINER ==="
            docker compose up -d --force-recreate school-portal-app

            echo "=== RESTARTING WORKER CONTAINER ==="
            docker compose up -d --force-recreate school-portal-worker

            echo "=== CLEANING UP OLD DOCKER IMAGES ==="
            docker image prune -f

            echo "=== DEPLOYMENT COMPLETE ==="
            docker compose ps
