name: Automated Production Deployment (Direct SSH Pipeline)

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy-to-vps:
    name: Deploy Live Application to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Hostinger VPS & Update Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script_stop: false
          envs:
            - COMPOSE_FILE
          script: |
            cd /var/www/school-portal
            COMPOSE_FILE="/var/www/school-portal/compose.yml"
            export COMPOSE_FILE

            echo "=== REMOVING LEGACY DOCKER-COMPOSE.YML ==="
            rm -f docker-compose.yml || true

            echo "=== PULLING LATEST CODE FROM MAIN ==="
            git pull origin main

            echo "=== BUILDING NEW APP IMAGE ==="
            docker compose -f "$COMPOSE_FILE" build school-portal-app

            echo "=== RESTARTING APP CONTAINER ==="
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate school-portal-app

            echo "=== RESTARTING WORKER CONTAINER ==="
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate school-portal-worker

            echo "=== CLEANING UP OLD DOCKER IMAGES ==="
            docker image prune -f || true

            echo "=== DEPLOYMENT COMPLETE ==="
            docker compose -f "$COMPOSE_FILE" ps || true
