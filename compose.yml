version: '3.8'
services:
  school-portal-db:
    image: mysql:8.0
    container_name: school-portal-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: school_portal
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: StrongPassword123!
    volumes:
      - portal_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3308:3306"
    command: >
      mysqld --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=1073741824
      --max-connections=200
      --wait-timeout=300
      --interactive-timeout=300
    networks:
      - portal_network

  school-portal-app:
    image: ghcr.io/icitify-portals/school-portal-app:latest
    container_name: school-portal-app
    restart: always
    depends_on:
      - school-portal-db
    env_file: .env
    environment:
      - DATABASE_URL=mysql://portal_user:StrongPassword123!@school-portal-db:3306/school_portal
      - NEXT_PUBLIC_APP_URL=https://portal.fssibadan.edu.ng
      - REDIS_HOST=school-portal-redis
    ports:
      - "3005:3000"
    networks:
      - portal_network

  school-portal-redis:
    image: redis:alpine
    container_name: school-portal-redis
    restart: always
    networks:
      - portal_network

  school-portal-worker:
    image: ghcr.io/icitify-portals/school-portal-app:latest
    container_name: school-portal-worker
    restart: always
    command: npm run worker
    depends_on:
      - school-portal-db
      - school-portal-redis
    env_file: .env
    environment:
      - DATABASE_URL=mysql://portal_user:StrongPassword123!@school-portal-db:3306/school_portal
      - REDIS_HOST=school-portal-redis
    networks:
      - portal_network

volumes:
  portal_mysql_data:

networks:
  portal_network:
    driver: bridge
